<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة مسار الرمال - النظام الداخلي المتكامل</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sand: { 50: '#fdfbf7', 100: '#fbf7ed', 200: '#f4ebd2', 500: '#d4af37', 700: '#aa841c' },
                        darkgreen: { 800: '#14342b', 900: '#0b1d18' }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Library -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #fdfbf7; }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- رسائل التنبيهات المنبثقة الشاملة -->
    <div id="toast-container" class="fixed top-4 left-4 z-50 max-w-sm w-full space-y-2"></div>

    <!-- نافذة التحميل الشاملة للعمليات الخلفية -->
    <div id="global-loader" class="fixed inset-0 bg-darkgreen-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden-view">
        <div class="bg-white p-6 rounded-xl shadow-xl flex flex-col items-center">
            <i class="fa-solid fa-circle-notch fa-spin text-darkgreen-800 text-4xl mb-4"></i>
            <p id="global-loader-text" class="text-sm font-semibold text-slate-700">جاري معالجة طلبك الحريص...</p>
        </div>
    </div>

    <!-- واجهة تسجيل الدخول الموحدة -->
    <div id="view-login" class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-sand-200">
            <div class="text-center mb-8">
                <img src="logo.png" alt="شعار مسار الرمال" class="mx-auto h-24 mb-4 object-contain" onerror="this.src='https://placehold.co'">
                <h1 class="text-2xl font-bold text-darkgreen-800">نظام إدارة مسار الرمال</h1>
                <p class="text-sm text-slate-500 mt-2">قم بتسجيل الدخول للوصول إلى لوحتك التشغيلية</p>
            </div>
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-700">البريد الإلكتروني</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute right-3 top-3.5 text-slate-400"></i>
                        <input type="email" id="login-email" required class="w-full pr-10 pl-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-darkgreen-800 outline-none transition" placeholder="username@company.com">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-700">كلمة المرور</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute right-3 top-3.5 text-slate-400"></i>
                        <input type="password" id="login-password" required class="w-full pr-10 pl-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-darkgreen-800 outline-none transition" placeholder="••••••••••••">
                    </div>
                </div>
                <button type="submit" id="btn-login-submit" class="w-full bg-darkgreen-800 text-white font-semibold py-3 rounded-lg hover:bg-darkgreen-900 transition flex justify-center items-center gap-2">
                    <span>دخول آمن</span>
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم العامة بعد المصادقة -->
    <div id="view-dashboard" class="flex-1 flex flex-col hidden-view">
        <!-- الهيدر العلوي وشريط التنقل -->
        <header class="bg-darkgreen-800 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="toggleMobileSidebar()" class="lg:hidden p-2 text-white hover:bg-darkgreen-900 rounded-lg">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <img src="logo.png" alt="مسار الرمال" class="h-10 object-contain" onerror="this.src='https://placehold.co'">
                    <span class="font-bold text-lg hidden sm:inline border-r pr-3 border-darkgreen-900">مسار الرمال الداخلي</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-left hidden md:block">
                        <p id="user-display-name" class="font-semibold text-sm leading-tight"></p>
                        <p id="user-display-role" class="text-xs text-sand-500"></p>
                    </div>
                    <button onclick="handleLogout()" class="bg-red-700 hover:bg-red-800 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span class="hidden sm:inline">خروج</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- الهيكل الداخلي الموزع على جزئين -->
        <div class="flex-1 max-w-7xl w-full mx-auto flex flex-col lg:flex-row relative">
            <!-- القائمة الجانبية للتنقل الذكي والتجاوبي -->
            <aside id="sidebar" class="bg-white border-l border-slate-200 w-64 shrink-0 fixed lg:sticky top-16 bottom-0 right-0 z-30 transition-transform transform translate-x-full lg:translate-x-0 p-4 space-y-2 lg:block">
                <div id="nav-group-admin" class="space-y-1 hidden-view">
                    <p class="text-xs font-bold text-slate-400 uppercase px-3 mb-2 tracking-wider">لوحة الإدارة العليا</p>
                    <button onclick="switchTab('admin-overview')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-chart-pie w-5 text-center"></i> نظرة عامة</button>
                    <button onclick="switchTab('admin-supervisors')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-user-tie w-5 text-center"></i> إدارة المشرفين</button>
                    <button onclick="switchTab('admin-monitor')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-eye w-5 text-center"></i> مراقبة السجلات التشغيلية</button>
                </div>
                <div id="nav-group-supervisor" class="space-y-1 hidden-view">
                    <p class="text-xs font-bold text-slate-400 uppercase px-3 mb-2 tracking-wider">العمليات الحقلية والميدانية</p>
                    <button onclick="switchTab('sup-workers')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-users w-5 text-center"></i> العمال والموظفين</button>
                    <button onclick="switchTab('sup-attendance')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-calendar-check w-5 text-center"></i> سجلات الحضور والانصراف</button>
                    <button onclick="switchTab('sup-purchases')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-receipt w-5 text-center"></i> إدارة عهد المشتريات</button>
                    <button onclick="switchTab('sup-tasks')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-list-check w-5 text-center"></i> المهام والتكليفات</button>
                    <button onclick="switchTab('sup-reports')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-file-lines w-5 text-center"></i> التقارير الدورية</button>
                </div>
                <div class="pt-4 border-t border-slate-100">
                    <button onclick="switchTab('global-settings')" class="nav-btn w-full text-right flex items-center gap-2.5 px-3 py-2.5 rounded-lg font-medium text-sm transition hover:bg-slate-100"><i class="fa-solid fa-gear w-5 text-center"></i> إعدادات الحساب الشخصي</button>
                </div>
            </aside>

            <!-- خلفية الضباب عند فتح الهامبرغر بالقائمة الجانبية -->
            <div id="sidebar-overlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/40 z-20 hidden-view lg:hidden"></div>

            <!-- ساحة العمل التفاعلية والصفحات الفرعية -->
            <main class="flex-1 p-4 md:p-6 overflow-x-hidden min-h-[calc(100vh-4rem)]">
                
                <!-- التبويب الفرعي: نظرة عامة للإدارة -->
                <div id="tab-admin-overview" class="tab-content space-y-6 hidden-view">
                    <h2 class="text-xl font-bold text-darkgreen-800">إحصائيات الشركة ونظرة عامة حية</h2>
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
